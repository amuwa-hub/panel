<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://amuwa-hub.github.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://amuwa-hub.github.io; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src https://koku.app.n8n.cloud; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="WebTara">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F5EDE4">
<title>AI WebTara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap">
<link rel="stylesheet" href="https://amuwa-hub.github.io/tara/tara.css">
<style>
:root{
  /* baby pink and beige (10 Nov 2026). The --lime* names are kept so every rule follows the new colours. */
  --bg:#F5EDE4; --card:#FFFCF9; --soft:#F8F0E8; --line:#EADCCF; --hero2:#F2DDCB;
  --ink:#2B201E; --muted:#6E615A; --lime:#F7C9D3; --lime2:#E79AAD; --limeT:#FCE6EB; --limeInk:#8A2D49;
  --alert:#FBE1D3; --alertInk:#A23A1C; --dot:#D64F45; --nav:#2B201E; --navInk:#EADDD4;
  --ease-out:cubic-bezier(0.23,1,0.32,1); --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1); --ease-icon:cubic-bezier(0.2,0,0,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:Urbanist,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
h1,h2{text-wrap:balance;margin:0}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* press */
.press{transition:transform 160ms var(--ease-out)}
.press:active{transform:scale(0.96)}
/* screens */
.screens{position:relative;padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.screen{display:flex;flex-direction:column;gap:14px;padding-top:10px}
.screen.enter{animation:scrIn 220ms var(--ease-out) both}
.screen.enter.back{animation-name:scrInBack}
@keyframes scrIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes scrInBack{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:16px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;white-space:nowrap}
.pill.new{background:var(--limeT);color:var(--limeInk)}
.pill.late{background:var(--alert);color:var(--alertInk)}
.pill.done{background:var(--soft);color:var(--muted)}
.av{flex:0 0 auto;width:40px;height:40px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.h-title{font-size:26px;font-weight:800;letter-spacing:-0.02em}
/* reveal */
.rv{opacity:0;transform:translateY(8px)}
.rv.in{opacity:1;transform:none;transition:opacity 300ms var(--ease-out),transform 300ms var(--ease-out)}
/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bell{position:relative;width:44px;height:44px;border-radius:999px;background:var(--card);border:0;display:flex;align-items:center;justify-content:center}
.bell .d{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:999px;background:var(--dot)}
.bell .d.ping{animation:ping 900ms var(--ease-out) 1}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(226,85,46,.5)}100%{box-shadow:0 0 0 10px rgba(226,85,46,0)}}
/* ask bar */
.ask{min-height:52px;border-radius:999px;background:var(--card);display:flex;align-items:center;gap:10px;padding:6px;border:0;width:100%;text-align:left;color:var(--muted);font-weight:600}
.ask .sp{flex:0 0 auto;width:40px;height:40px;border-radius:999px;background:var(--ink);color:var(--lime);display:flex;align-items:center;justify-content:center}
.ask .tx{flex:1}
.ask .mc{flex:0 0 auto;width:40px;height:40px;border-radius:999px;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center}
.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.sugg::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:36px;border-radius:999px;background:var(--card);border:1px solid var(--line);padding:0 12px;font-size:13px;font-weight:700}
/* hero */
.hero{border-radius:24px;padding:18px;background:linear-gradient(160deg,var(--lime) 0%,var(--hero2) 100%);display:flex;flex-direction:column;gap:14px}
.big{font-size:64px;line-height:60px;font-weight:800;letter-spacing:-2px}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:96px;position:relative}
.wk .b{height:100%;display:flex;align-items:flex-end;position:relative;border:0;background:none;padding:0}
.wk .b i{display:block;width:100%;border-radius:10px;background:rgba(255,255,255,.6);transform-origin:bottom;transform:scaleY(.04);transition:transform 520ms var(--ease-out),background 200ms var(--ease-out)}
.wk.in .b i{transform:scaleY(1)}
.wk .b.today i{background:var(--ink)}
.wk .b[aria-pressed=true] i{background:var(--ink)}
.wkl{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;font-size:11px;font-weight:600;text-align:center;color:#8A2D49}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translate(-50%,4px);background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms var(--ease-out),transform 150ms var(--ease-out)}
.b[aria-pressed=true] .tip{opacity:1;transform:translate(-50%,0)}
.cta{min-height:48px;border-radius:999px;background:var(--ink);color:#fff;border:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;width:100%}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border-radius:20px;padding:14px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:left}
.tile .v{font-size:32px;font-weight:800;line-height:34px;letter-spacing:-0.02em}
.tile .l{font-size:13px;font-weight:600;color:var(--muted);line-height:17px}
.spark{width:100%;height:26px;display:block}
.spark path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.draw{transition:stroke-dashoffset 900ms var(--ease-out)}
.delta{font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px;display:inline-flex;align-items:center;gap:3px}
.delta.up{background:var(--limeT);color:var(--limeInk)}
.delta.down{background:var(--alert);color:var(--alertInk)}
/* segmented */
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--card);border-radius:999px;padding:4px}
.seg button{position:relative;z-index:1;min-height:40px;border:0;background:none;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:color 200ms var(--ease-out)}
.seg button[aria-pressed=true]{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--ink);transition:transform 250ms var(--ease-in-out)}
.seg[data-v="1"] .thumb{transform:translateX(100%)}
/* request cards */
.list{display:flex;flex-direction:column;gap:12px}
.swipe{position:relative;border-radius:22px;overflow:hidden;transition:opacity 200ms var(--ease-out),transform 200ms var(--ease-out),margin 240ms var(--ease-out),max-height 240ms var(--ease-out)}
.swipe .under{position:absolute;inset:0;background:var(--lime);display:flex;align-items:center;padding-left:22px;gap:8px;font-weight:800;color:var(--ink)}
.swipe .under svg{transform:scale(.6);opacity:.4;transition:transform 200ms var(--ease-out),opacity 200ms var(--ease-out)}
.swipe.armed .under svg{transform:scale(1);opacity:1}
.req{position:relative;background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;will-change:transform}
.req.late{box-shadow:inset 0 0 0 2px #EFB3A0}
.req.settle{transition:transform 320ms var(--ease-out)}
.fields{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:600}
.fields span{background:var(--soft);border-radius:999px;padding:4px 10px}
.acts{display:flex;gap:8px}
.btn{flex:1 1 0;min-height:46px;border-radius:999px;border:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;text-decoration:none}
.btn.dark{background:var(--ink);color:#fff}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.lime{background:var(--lime);color:var(--ink)}
.ok{flex:0 0 auto;width:46px;height:46px;border-radius:999px;border:0;background:var(--lime);display:grid;place-items:center;position:relative}
.ok>span{grid-area:1/1;display:flex;transition:transform 260ms var(--ease-icon),opacity 260ms var(--ease-icon),filter 260ms var(--ease-icon)}
.ok .i2{transform:scale(.25);opacity:0;filter:blur(4px)}
.ok.done .i1{transform:scale(.25);opacity:0;filter:blur(4px)}
.ok.done .i2{transform:scale(1);opacity:1;filter:blur(0)}
.ok.done{background:var(--ink);color:var(--lime)}
.hint{font-size:12px;color:var(--muted);font-weight:600;text-align:center}
.empty{text-align:center;padding:28px 16px;color:var(--muted);font-weight:600}
.empty .big2{font-size:40px}
/* skeleton */
.sk{background:linear-gradient(90deg,#EEE2D6 0%,#F7EEE5 50%,#EEE2D6 100%);background-size:200% 100%;animation:sh 1.1s linear infinite;border-radius:22px}
@keyframes sh{to{background-position:-200% 0}}
/* insights */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;min-height:38px;border-radius:999px;border:0;background:var(--card);padding:0 14px;font-weight:700;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;transition:background 200ms var(--ease-out),color 200ms var(--ease-out)}
.pchip[aria-pressed=true]{background:var(--ink);color:#fff}
.pchip[disabled]{opacity:.55}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:18px;padding:12px}
.kpi b{display:block;font-size:22px;font-weight:800;letter-spacing:-0.02em}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gridl{stroke:var(--line);stroke-width:1}
.line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.prev{fill:none;stroke:#CDB8AB;stroke-width:2;stroke-dasharray:4 5}
.area{fill:url(#ag);opacity:0;transition:opacity 600ms var(--ease-out) 300ms}
.chart.in .area{opacity:1}
.scrub{opacity:0;transition:opacity 120ms}
.chart.scrubbing .scrub{opacity:1}
.ctip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:4px 8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 120ms}
.chart.scrubbing .ctip{opacity:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);font-weight:600}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.bub{position:relative;height:200px}
.bub div{position:absolute;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid #fff;transform:scale(.6);opacity:0}
.bub.in div{animation:pop 620ms cubic-bezier(.34,1.56,.64,1) forwards}
.bub.in div:nth-child(2){animation-delay:90ms}.bub.in div:nth-child(3){animation-delay:180ms}
@keyframes pop{to{transform:scale(1);opacity:1}}
.bub b{font-weight:800;letter-spacing:-0.02em}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:120px}
.days .c{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.days .c i{display:block;width:100%;border-radius:10px;background:var(--limeT);transform-origin:bottom;transform:scaleY(.04);transition:transform 520ms var(--ease-out)}
.days.in .c i{transform:scaleY(1)}
.days .c.top i{background:var(--lime)}
.days .c span{font-size:11px;font-weight:700;color:var(--muted)}
.hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:3px}
.hours i{display:block;height:34px;border-radius:5px;background:var(--ink);opacity:0;transform:scaleY(.4);transition:opacity 400ms var(--ease-out),transform 400ms var(--ease-out)}
.hours.in i{transform:none}
.hl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600;margin-top:6px}
.hbar{display:flex;flex-direction:column;gap:10px}
.hbar .r{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:10px;font-size:13px;font-weight:700}
.hbar .t{height:14px;border-radius:999px;background:var(--soft);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:999px;background:var(--lime);clip-path:inset(0 100% 0 0);transition:clip-path 700ms var(--ease-out)}
.hbar.in .t i{clip-path:inset(0 0 0 0)}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:0 0 auto}
.ring circle.f{transition:stroke-dashoffset 1s var(--ease-out)}
.dark{background:var(--ink);color:#fff}
.dark .muted{color:#B9BCB2}
.lockwrap{position:relative;border-radius:24px;overflow:hidden}
.lockwrap .ghost{position:absolute;inset:0;filter:blur(5px);opacity:.55;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.lockwrap .lk{position:relative;display:flex;align-items:center;justify-content:center;padding:28px 12px}
.lockcard{background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(43,32,30,.12);width:100%}
.lockcard ul{margin:0;padding-left:18px;font-size:14px;line-height:21px;font-weight:600}
/* account */
.menu{background:var(--card);border-radius:24px;padding:8px;display:flex;flex-direction:column}
.mrow{min-height:60px;border-radius:16px;display:flex;align-items:center;gap:12px;padding:0 10px;border:0;background:none;width:100%;text-align:left;text-decoration:none}
.mrow .ic{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mrow b{display:block;font-size:15px}
.mrow small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.mrow .tx{flex:1;min-width:0}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));background:var(--nav);border-radius:999px;padding:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));z-index:20}
.nav button{position:relative;z-index:1;min-height:54px;border:0;background:none;border-radius:999px;color:var(--navInk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;transition:color 200ms var(--ease-out)}
.nav button[aria-current=page]{color:var(--ink);font-weight:800}
.nav .pillbg{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:999px;background:var(--lime);transition:transform 280ms var(--ease-in-out)}
.nav .badge{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;border-radius:999px;background:var(--dot);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;font-size:14px;z-index:30;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform 400ms ease,opacity 400ms ease}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{border:0;background:var(--lime);color:var(--ink);border-radius:999px;min-height:36px;padding:0 14px;font-weight:800}
/* tara sheet */
.backdrop{position:fixed;inset:0;background:rgba(43,32,30,.38);opacity:0;pointer-events:none;transition:opacity 250ms var(--ease-out);z-index:40}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(480px,100%);height:min(88dvh,760px);transform:translate(-50%,100%);background:linear-gradient(160deg,#FDEDF1 0%,#FFFFFF 55%,#F6EADF 100%);border-radius:28px 28px 0 0;z-index:41;display:flex;flex-direction:column;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));transition:transform 260ms var(--ease-out)}
.sheet.on{transform:translate(-50%,0);transition:transform 460ms var(--ease-drawer)}
.sheet.drag{transition:none}
.grab{padding:8px 0 12px;touch-action:none;cursor:grab}
.grab i{display:block;width:44px;height:5px;border-radius:999px;background:#E2D2C6;margin:0 auto}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:14px 2px;overscroll-behavior:contain}
.m{max-width:86%;padding:11px 14px;font-size:15px;line-height:21px;animation:mIn 220ms var(--ease-out) both}
@keyframes mIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.m.me{align-self:flex-end;background:var(--ink);color:#fff;border-radius:20px 20px 6px 20px}
.m.t{align-self:flex-start;background:#fff;border-radius:20px 20px 20px 6px;box-shadow:0 4px 16px rgba(43,32,30,.06);display:flex;flex-direction:column;gap:10px}
.m .acts{gap:8px;flex-wrap:wrap}
.m .btn{min-height:42px;flex:1 1 140px;font-size:13px;position:relative;overflow:hidden}
.m .btn .fill{position:absolute;inset:0;background:var(--ink);clip-path:inset(0 100% 0 0)}
.m .btn.go .fill{clip-path:inset(0 0 0 0);transition:clip-path 700ms linear}
.m .btn span{position:relative}
.m .btn.go span{color:#fff}
.typing{display:flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:999px;background:#A8958A;animation:td 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{0%,100%{opacity:.3}50%{opacity:1}}
.tchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.tchips::-webkit-scrollbar{display:none}
.tchips .chip{animation:mIn 220ms var(--ease-out) 80ms both}
.inrow{min-height:56px;border-radius:999px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 6px 0 16px}
.inrow input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px}
.ib{width:44px;height:44px;border-radius:999px;border:0;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
.ib.mic{background:var(--soft)}
.ib.mic.on::after{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid var(--lime2);animation:ring 1.2s var(--ease-out) infinite}
@keyframes ring{from{transform:scale(1);opacity:1}to{transform:scale(1.5);opacity:0}}
.ib.send{background:var(--ink);color:var(--lime)}
/* login */
.login{display:flex;flex-direction:column;gap:16px;padding-top:16px}
.codes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.codes input{height:54px;border-radius:14px;border:0;background:var(--soft);text-align:center;font-size:22px;font-weight:800;outline:none;transition:transform 120ms var(--ease-out),background 200ms var(--ease-out),box-shadow 200ms}
.codes input:focus{box-shadow:inset 0 0 0 2px var(--ink);background:#fff}
.codes.ok input{background:var(--lime)}
.codes.shake{animation:shake 300ms var(--ease-out)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

function getLS(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function setLS(k,v){ try { if (v==null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
var TOKEN = getLS('amuwa_panel_token');
if (TOKEN && !/^[0-9a-f]{64}$/.test(TOKEN)) TOKEN = null;

/* ---------- state ---------- */
var D = null;             // panel data for 30 days (home, requests, account)
var INS = {};             // Pro insights by period
var REQ = [], DONE = [];
var state = { screen:'login', seg:0, period:30, seen:{}, site:getLS('amuwa_panel_site') || null, loadedAt:0, busy:false };
var pending = {};         // mark-called waiting for the undo window: id -> {timer, via}

/* ---------- network ---------- */
function post(url, body, ms){
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var t = ctl ? setTimeout(function(){ ctl.abort(); }, ms||20000) : null;
  return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal: ctl?ctl.signal:undefined, credentials:'omit', cache:'no-store' })
    .then(function(r){ if (t) clearTimeout(t); return r.json().catch(function(){ return { ok:false, error:'server' }; }); })
    .catch(function(){ if (t) clearTimeout(t); return { ok:false, error:'offline' }; });
}
function api(body, ms){ return post(API, body, ms); }

/* ---------- data shaping ---------- */
function firstLetter(n){ var m=String(n||'').match(/[A-Za-z0-9\u0900-\u097F]/); return m ? m[0].toUpperCase() : '?'; }
function bizAv(st){ var lg = D && D.site && D.site.logo_url; if (lg && /^https:\/\//.test(lg)) return '<span class="av avlogo" style="'+st+'"><img src="'+esc(lg)+'" alt="" onerror="this.parentNode.textContent=\''+esc(firstLetter(biz()))+'\'"></span>'; return '<span class="av" style="background:var(--ink);color:var(--lime);'+st+'">'+esc(firstLetter(biz()))+'</span>'; }
function initials(n){ var p=String(n||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return '?'; return ((p[0][0]||'')+(p.length>1?(p[p.length-1][0]||''):'')).toUpperCase(); }
var fmtDay = new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',timeZone:'Asia/Kolkata'});
var fmtTime = new Intl.DateTimeFormat('en-IN',{hour:'numeric',minute:'2-digit',hour12:true,timeZone:'Asia/Kolkata'});
var fmtWd = new Intl.DateTimeFormat('en-IN',{weekday:'short',timeZone:'Asia/Kolkata'});
function istDate(d){ return new Date(d.getTime()+330*60000).toISOString().slice(0,10); }
function when(iso){
  var d = new Date(iso); if (isNaN(d)) return '';
  var t = fmtTime.format(d).replace(/\s?(am|pm)/i, function(m){ return ' '+m.trim().toLowerCase(); });
  var today = istDate(new Date()), yest = istDate(new Date(Date.now()-864e5)), day = istDate(d);
  if (day===today) return 'Today, '+t; if (day===yest) return 'Yesterday, '+t;
  if (Date.now()-d.getTime() < 6*864e5) return fmtWd.format(d)+', '+t;
  return fmtDay.format(d);
}
function waitText(h){ return h>=48 ? Math.floor(h/24)+' days' : h+' h'; }
function fieldVals(f){ var out=[]; if (f && typeof f==='object') Object.keys(f).forEach(function(k){ var v=String(f[k]==null?'':f[k]).trim(); if(v && !/phone|mobile|number|email/i.test(k)) out.push(v.length>40?v.slice(0,40)+'…':v); }); return out.slice(0,6); }
function shapeTickets(){
  var now = Date.now(); REQ = []; DONE = [];
  (D && D.tickets || []).forEach(function(t){
    var r = { id:t.id, name:t.name || 'Customer', ini:initials(t.name||'C'), at:when(t.created_at), created:t.created_at,
      h: Math.max(0, Math.floor((now-new Date(t.created_at).getTime())/36e5)), f:fieldVals(t.fields), fields:t.fields||{}, phone:t.phone||'', note:t.note||'', note_at:t.note_at||null };
    if (t.status==='new' && !pending[t.id]) REQ.push(r); else { r.at = t.called_back_at ? 'Called '+when(t.called_back_at) : r.at; DONE.push(r); }
  });
  REQ.sort(function(a,b){ return b.h-a.h; });
}
function pro(){ return !!(D && D.site && D.site.plan==='pro'); }
function biz(){ return D && D.site ? D.site.name : ''; }
function first(n){ return String(n||'').split(/\s+/)[0]; }
function taps(t){ t=t||{}; return (t.calls||0)+(t.whatsapp||0)+(t.directions||0); }
function SPAN(){ return (D && D.days) || 30; }
function within30(iso){ return Date.now()-new Date(iso).getTime() <= SPAN()*864e5; }

/* ---------- load ---------- */
function loadData(opts){
  opts = opts || {};
  if (!TOKEN) { showLogin(); return Promise.resolve(); }
  if (!D) render(false, true);
  return api({ action:'data', token:TOKEN, site_id:state.site||undefined, days:30 }).then(function(r){
    if (r && r.ok) {
      D = r; INS = {}; state.site = r.site.site_id; setLS('amuwa_panel_site', state.site); state.loadedAt = Date.now();
      shapeTickets(); if (state.screen==='login' || opts.home) { state.screen='home'; state.seen={}; }
      document.title = biz() + ' · Panel';
      renderNav(); if (!opts.quiet) render(false); else softRefresh();
      return;
    }
    if (r && (r.error==='login' || r.error==='no_panel' || r.error==='no_site')) {
      if (r.error==='no_site' && state.site) { state.site=null; setLS('amuwa_panel_site',null); return loadData(opts); }
      TOKEN=null; setLS('amuwa_panel_token',null); D=null;
      showLogin(r.error==='no_panel' ? 'This email has no Plus or Pro website yet. Call or WhatsApp Amuwa on '+HELP+'.' : (opts.quiet?'':'Please log in again.'));
      return;
    }
    if (!opts.quiet) { if (!D) renderOffline(); else toast('Couldn\'t connect. Check your internet.'); }
  });
}
function softRefresh(){
  // re-render only if nothing is being touched
  if (state.busy || $('agent').classList.contains('on') || Object.keys(pending).length) { renderNav(); return; }
  if (state.screen==='home' || state.screen==='requests') render(false); else renderNav();
}
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState==='hidden') flushPending();
  else if (D && Date.now()-state.loadedAt > 60000) loadData({ quiet:true });
});
setInterval(function(){ if (D && document.visibilityState==='visible' && Date.now()-state.loadedAt > 120000) loadData({ quiet:true }); }, 30000);
window.addEventListener('pagehide', flushPending);

/* ---------- nav ---------- */
var ORDER = ['home','requests','insights','account'];
var NAVI = { home:['home','Home'], requests:['list','Enquiries'], insights:['chart','Insights'], account:['user','Account'] };
function renderNav(){
  document.querySelectorAll('#nav button[data-s]').forEach(function(b){
    var s=b.getAttribute('data-s'), on = s===state.screen;
    b.setAttribute('aria-current', on?'page':'false');
    b.setAttribute('aria-label', NAVI[s][1]+(s==='requests'&&REQ.length?', '+REQ.length+' waiting':''));
    b.innerHTML = ic(NAVI[s][0], on?18:20) + NAVI[s][1] + (s==='requests' && REQ.length && !on ? '<span class="badge num">'+REQ.length+'</span>' : '');
  });
  var i = { home:0, requests:1, insights:3, account:4 }[state.screen] || 0; $('pillbg').style.transform = 'translateX('+(i*100)+'%)';
}
$('nav').addEventListener('click', function(e){ if (e.target.closest('#navTara')) { openTara(''); return; } var b=e.target.closest('button[data-s]'); if(b) go(b.getAttribute('data-s')); });
function go(s, force){
  if (s===state.screen && !force) return;
  var back = ORDER.indexOf(s) < ORDER.indexOf(state.screen);
  state.screen = s; renderNav(); render(back);
  window.scrollTo({top:0, behavior:'instant'});
}

/* ---------- screens ---------- */
function render(back, loading){
  var root = $('screens');
  if (loading) {
    root.innerHTML = '<section class="screen" id="scr" aria-busy="true"><div class="sk" style="height:48px"></div><div class="sk" style="height:52px;border-radius:999px"></div><div class="sk" style="height:300px;border-radius:24px"></div><div class="tiles"><div class="sk" style="height:118px"></div><div class="sk" style="height:118px"></div></div></section>';
    $('nav').hidden = true; setMascot(false); return;
  }
  var html = { home:homeHTML, requests:reqHTML, insights:insHTML, account:accHTML, login:loginHTML }[state.screen]();
  root.innerHTML = '<section class="screen'+(RM?'':' enter')+(back?' back':'')+'" id="scr">'+html+'</section>';
  var key = state.screen+(D?D.site.site_id:''), firstTime = !state.seen[key]; state.seen[key]=true;
  ({ home:homeFX, requests:reqFX, insights:insFX, account:accFX, login:loginFX })[state.screen]($('scr'), firstTime);
  $('nav').hidden = state.screen==='login';
  setMascot(state.screen!=='login');
}
function renderOffline(){
  $('screens').innerHTML = '<section class="screen enter" id="scr"><div class="empty card"><div class="big2">📶</div><p style="margin:8px 0 14px">Couldn\'t connect. Check your internet and try again.</p><button type="button" class="cta press" id="retry">'+ic('refresh')+'Try again</button></div></section>';
  $('nav').hidden = true; setMascot(false);
  $('retry').addEventListener('click', function(){ loadData(); });
}
var FLOAT = getLS('amuwa_panel_float') !== 'off';
function setMascot(on){ var mx=$('mx'); if (mx) mx.classList.toggle('away', !(on && FLOAT)); }

/* helpers */
function countUp(el, to, ms){
  if (RM || !ms || ms<5) { el.textContent = nf(to); return; }
  var t0 = null;
  function step(t){ if(!t0) t0=t; var p=Math.min(1,(t-t0)/ms); var e=1-Math.pow(1-p,3); el.textContent = nf(Math.round(to*e)); if(p<1) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
function afterPaint(fn){ requestAnimationFrame(function(){ requestAnimationFrame(fn); }); }
function revealIn(root){ var els = root.querySelectorAll('.rv'); els.forEach(function(el,i){ setTimeout(function(){ el.classList.add('in'); }, RM?0:Math.min(i,6)*50); }); }
function drawPaths(root){ root.querySelectorAll('path.draw').forEach(function(p){ var L=p.getTotalLength(); if(!L) return; p.style.strokeDasharray=L; p.style.strokeDashoffset=L; p.getBoundingClientRect(); afterPaint(function(){ p.style.strokeDashoffset=0; }); }); }
function sparkPath(vals,w,h){ if (vals.length<2) vals=[0,0]; var mx=Math.max.apply(null,vals), mn=Math.min.apply(null,vals); var r=(mx-mn)||1; return vals.map(function(v,i){ return (i?'L':'M')+(i*(w/(vals.length-1))).toFixed(1)+' '+(h-2-(mx===mn?0.5:(v-mn)/r)*(h-4)).toFixed(1); }).join(' '); }
function headerHTML(){
  var plan = pro()?'Pro':'Plus';
  return '<div class="hdr rv"><div class="row" style="min-width:0">'+bizAv('')+'<div style="min-width:0"><b style="font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(biz())+'</b><span class="muted" style="font-size:13px">'+plan+' plan</span></div></div><button type="button" class="bell press" data-go="requests" aria-label="'+REQ.length+' enquiries waiting">'+ic('bell',20,1.8)+(REQ.length?'<span class="d" id="bellDot"></span>':'')+'</button></div>';
}

/* HOME */
function homeHTML(){
  var sp = (D.spark||[]), wk = sp.slice(-7);
  var mx = Math.max.apply(null, wk.map(function(x){return x.visits;}).concat([1]));
  var wdn = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var bars = wk.map(function(x,i){ var dt=new Date(String(x.day).slice(0,10)+'T12:00:00Z'); return '<button type="button" class="b'+(i===wk.length-1?' today':'')+'" aria-pressed="false" aria-label="'+wdn[dt.getUTCDay()]+': '+x.visits+' visits" style="height:100%"><i style="height:'+Math.max(6,Math.round(x.visits/mx*100))+'%;transition-delay:'+(RM?0:i*45)+'ms"></i><span class="tip num">'+nf(x.visits)+' visits</span></button>'; }).join('');
  var labels = wk.map(function(x,i){ var dt=new Date(String(x.day).slice(0,10)+'T12:00:00Z'); return '<span'+(i===wk.length-1?' style="color:var(--ink);font-weight:800"':'')+'>'+(i===wk.length-1?'Today':wdn[dt.getUTCDay()])+'</span>'; }).join('');
  var late = REQ.filter(function(r){return r.h>=2;}).length;
  var top = REQ.find(function(r){ return r.phone; });
  var weekVisits = wk.reduce(function(s,x){return s+x.visits;},0);
  var req30 = (D.tickets||[]).filter(function(t){ return within30(t.created_at); }).length;
  function tile(v,l,vals,key){ return '<button type="button" class="tile press rv" data-go="'+key+'"><div class="row between" style="align-items:flex-start"><span class="v num" data-count="'+v+'">0</span>'+ic('arrow')+'</div><svg class="spark" viewBox="0 0 120 26" preserveAspectRatio="none"><path class="draw" d="'+sparkPath(vals,120,26)+'"/></svg><span class="l">'+l+'</span></button>'; }
  var col = function(k){ return sp.map(function(x){ return x[k]||0; }); };
  var chips = ['Who is waiting longest?','How many visits this week?', pro()?'Compare with last week':'Which enquiries are new?'];
  return headerHTML()
  + '<button type="button" class="ask press rv" data-tara=""><span class="sp tface" aria-hidden="true"></span><span class="tx">Ask Tara about your business…</span><span class="mc">'+ic('mic')+'</span></button>'
  + '<div class="sugg rv">'+chips.map(function(q){return '<button type="button" class="chip press" data-tara="'+esc(q)+'">'+esc(q)+'</button>';}).join('')+'</div>'
  + '<section class="hero rv"><div class="row between"><span style="font-size:15px;font-weight:700">Waiting for your reply</span><span class="pill" style="background:rgba(255,255,255,.55)">Now</span></div>'
  + '<div class="row" style="align-items:flex-end;flex-wrap:wrap"><span class="big num" data-count="'+REQ.length+'">0</span><span style="font-size:14px;font-weight:600;padding-bottom:6px">'+(REQ.length?(REQ.length===1?'customer':'customers')+(late?' · '+late+' waiting over 2 hours':''):'Everyone contacted. Nice!')+'</span></div>'
  + '<div><div style="font-size:12px;font-weight:600;color:var(--limeInk);margin-bottom:6px">Website visits this week: <b class="num">'+nf(weekVisits)+'</b> · tap a bar</div><div class="wk" id="wk">'+bars+'</div><div class="wkl" style="margin-top:6px">'+labels+'</div></div>'
  + (top?'<a class="cta press" href="'+telHref(top.phone)+'" data-callx="'+top.id+'">'+ic('phone')+'Call '+esc(first(top.name))+' first</a>':(REQ.length?'<button type="button" class="cta press" data-go="requests">See enquiries</button>':''))+'</section>'
  + '<div class="tiles">'
  + tile(req30,'enquiries in<br>last '+SPAN()+' days',col('requests'),'requests')
  + tile(D.totals.visits||0,'website visits<br>last '+SPAN()+' days',col('visits'),'insights')
  + tile(taps(D.totals),'call, WhatsApp and<br>directions taps',col('taps'),'insights')
  + tile(D.totals.tara_chats||0,'chats with<br>Tara',col('chats'),'insights')+'</div>';
}
function homeFX(scr, firstTime){
  revealIn(scr);
  scr.querySelectorAll('[data-count]').forEach(function(el){ countUp(el, +el.getAttribute('data-count'), firstTime?800:0); });
  var wk = $('wk'); afterPaint(function(){ wk.classList.add('in'); });
  if (firstTime) drawPaths(scr);
  if (firstTime && $('bellDot') && !RM) setTimeout(function(){ $('bellDot') && $('bellDot').classList.add('ping'); }, 900);
  wk.addEventListener('click', function(e){ var b=e.target.closest('.b'); if(!b) return; var on=b.getAttribute('aria-pressed')==='true'; wk.querySelectorAll('.b').forEach(function(x){x.setAttribute('aria-pressed','false');}); b.setAttribute('aria-pressed', on?'false':'true'); });
}

/* REQUESTS */
function telHref(p){ return 'tel:+91'+String(p).replace(/\D/g,'').slice(-10); }
function waHref(p, text){ return 'https://wa.me/91'+String(p).replace(/\D/g,'').slice(-10)+(text?'?text='+encodeURIComponent(text):''); }
function waDefault(r){ var bits=r.f.slice(0,2).join(', '); return 'Hi '+first(r.name)+', this is '+biz()+'. Thank you for your enquiry'+(bits?' ('+bits+')':'')+' on our website. Is this a good time to talk?'; }
var QUICK = ['Called, no answer','Will confirm later','Sent details on WhatsApp','Order confirmed'];
function noteBlock(r){
  if (state.noteOpen===r.id) return '<div class="noteed"><div class="qn">'+QUICK.map(function(q){ return '<button type="button" class="chip press" data-qn="'+esc(q)+'">'+esc(q)+'</button>'; }).join('')+'</div><textarea id="noteIn" maxlength="500" rows="2" placeholder="Write a note for yourself">'+esc(state.noteDraft!=null?state.noteDraft:r.note)+'</textarea><div class="row" style="gap:8px;justify-content:space-between;align-items:center"><span class="muted" style="font-size:12px">Only you see notes</span><span class="row" style="gap:8px"><button type="button" class="chip press" data-notecancel="1">Cancel</button><button type="button" class="chip dark press" data-notesave="'+r.id+'">'+ic('check',14,2.4)+' Save</button></span></div></div>';
  return r.note ? '<button type="button" class="note press" data-note="'+r.id+'"><span class="nic">'+ic('note',14)+'</span><span class="ntx"><span>'+hl(r.note)+'</span>'+(r.note_at?'<small>Note · '+esc(when(r.note_at))+'</small>':'')+'</span></button>' : '<button type="button" class="addnote press" data-note="'+r.id+'">'+ic('note',14)+'Add note</button>';
}
function reqCard(r){
  var lateDay = r.h>=24;
  return '<div class="swipe rv" data-id="'+r.id+'"><div class="under">'+ic('check',22,2.6)+'<span>Contacted</span></div>'
  + '<article class="req'+(lateDay?' late':'')+'"><div class="row"><span class="av" style="background:'+(lateDay?'var(--alert)':'var(--limeT)')+';color:'+(lateDay?'var(--alertInk)':'var(--limeInk)')+'">'+esc(r.ini)+'</span><div style="flex:1;min-width:0"><b style="font-size:16px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+hl(r.name)+'</b><span class="muted" style="font-size:12px">'+esc(r.at)+(r.phone?' · <span class="num">'+hl(r.phone)+'</span>':' · no number given')+'</span></div><span class="pill '+(r.h>=2?'late':'new')+'">'+(r.h>=2?'Waiting '+waitText(r.h):'New')+'</span></div>'
  + (r.f.length?'<div class="fields">'+r.f.map(function(x){return '<span>'+hl(x)+'</span>';}).join('')+'</div>':'')
  + noteBlock(r)
  + '<div class="acts">'+(r.phone?'<a href="'+telHref(r.phone)+'" class="btn dark press" data-callx="'+r.id+'">'+ic('phone',16)+'Call</a><a href="'+waHref(r.phone, waDefault(r))+'" target="_blank" rel="noopener" class="btn soft press" data-wax="'+r.id+'">'+ic('wa',16)+'WhatsApp</a>':'<span class="btn soft" style="color:var(--muted);font-weight:600">No number. Reply when they visit</span>')
  + '<button type="button" class="ok press" data-ok="'+r.id+'" aria-label="Mark '+esc(r.name)+' contacted"><span class="i1">'+ic('check',18,2.4)+'</span><span class="i2">'+ic('check',18,2.6)+'</span></button></div></article></div>';
}
function hl(s){ var e = esc(s), q = String(state.q||'').trim(); if (!q) return e;
  var words = q.split(/\s+/).filter(function(w){ return w.length>=2; }).map(function(w){ return esc(w).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); });
  if (!words.length) return e; try { return e.replace(new RegExp('('+words.join('|')+')','gi'), '<mark>$1</mark>'); } catch(_) { return e; } }
function matchR(r){
  var q = String(state.q||'').trim().toLowerCase(), w = state.when||'all';
  if (w!=='all') { var c = new Date(r.created), now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    if (w==='today' && c < d0) return false;
    if (w==='yday' && (c < new Date(d0.getTime()-864e5) || c >= d0)) return false;
    if (w==='week' && c < new Date(d0.getTime()-6*864e5)) return false;
    if (w==='month' && c < new Date(d0.getTime()-29*864e5)) return false; }
  if (!q) return true;
  var hay = [r.name, r.phone, r.note].concat(Object.keys(r.fields||{}).map(function(k){ return r.fields[k]; })).join(' ').toLowerCase();
  var digits = q.replace(/\D/g,'');
  return q.split(/\s+/).every(function(p){ return hay.indexOf(p) >= 0; }) || (digits.length>=3 && String(r.phone).replace(/\D/g,'').indexOf(digits) >= 0);
}
function listHTML(){
  var filtering = !!(String(state.q||'').trim() || (state.when && state.when!=='all'));
  var W = REQ.filter(matchR), Dn = DONE.filter(matchR), done = Dn.slice(0, 40);
  var none = '<div class="empty card rv">No enquiries match. <button type="button" class="linkbtn" data-clear="1">Clear search</button></div>';
  if (state.seg===0) return W.length ? W.map(reqCard).join('') + (filtering?'':'<p class="hint rv">Tip: swipe a card right to mark it contacted</p>') : (filtering && REQ.length ? none : '<div class="empty card rv"><div class="big2">🎉</div>Everyone has been contacted.</div>');
  return done.length ? done.map(doneCard).join('') + (Dn.length>40?'<p class="hint rv">Showing the latest 40. Search to find older ones.</p>':'') : (filtering && DONE.length ? none : '<div class="empty card rv">Enquiries you reply to will show here.</div>');
}
function doneCard(r){ return '<article class="req rv"><div class="row"><span class="av" style="background:var(--soft);color:var(--muted)">'+esc(r.ini)+'</span><div style="flex:1;min-width:0"><b style="display:block">'+hl(r.name)+'</b><span class="muted" style="font-size:12px">'+esc(r.at)+(r.phone?' · <span class="num">'+hl(r.phone)+'</span>':'')+'</span></div><span class="pill done">Contacted</span></div>'+(r.f.length?'<div class="fields">'+r.f.map(function(x){return '<span>'+hl(x)+'</span>';}).join('')+'</div>':'')+noteBlock(r)+'</article>'; }
function reqHTML(){
  var done = DONE.slice(0, 40);
  var list = state.seg===0 ? (REQ.length ? REQ.map(reqCard).join('') + '<p class="hint rv">Tip: swipe a card right to mark it contacted</p>' : '<div class="empty card rv"><div class="big2">🎉</div>Everyone has been contacted.</div>')

  if ($('chEmail')) $('chEmail').addEventListener('click', function(){ AUTH.step=1; paintAuth(true); });
  if ($('codes')) {
    var ins = Array.prototype.slice.call($('codes').querySelectorAll('input'));
    ins.forEach(function(inp,i){
      inp.addEventListener('input', function(){ var v=inp.value.replace(/\D/g,''); if (v.length>1) { v.split('').slice(0,6-i).forEach(function(ch,k){ if(ins[i+k]) ins[i+k].value=ch; }); var nx=ins[Math.min(5,i+v.length)]; if (i+v.length>=6) $('pw1').focus(); else nx.focus(); return; } inp.value=v; if(v){ inp.animate && !RM && inp.animate([{transform:'scale(.92)'},{transform:'scale(1)'}],{duration:140,easing:'cubic-bezier(0.23,1,0.32,1)'}); if(ins[i+1]) ins[i+1].focus(); else $('pw1').focus(); } });
      inp.addEventListener('keydown', function(e){ if(e.key==='Backspace' && !inp.value && ins[i-1]) ins[i-1].focus(); });
      inp.addEventListener('paste', function(e){ var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6); if(t.length){ e.preventDefault(); t.split('').forEach(function(ch,k){ if(ins[k]) ins[k].value=ch; }); $('pw1').focus(); } });
    });
    var fillCode = function(t){ var m=String(t||'').match(/\d{6}/) || [String(t||'').replace(/\D/g,'')].filter(function(x){return x.length===6;}); if (!m || !m[0]) return false; m[0].split('').forEach(function(ch,k){ ins[k].value=ch; }); $('codes').classList.remove('shake'); $('pw1').focus(); return true; };
    $('pasteCode').addEventListener('click', function(){
      if (!navigator.clipboard || !navigator.clipboard.readText) { ins[0].focus(); return err('Tap and hold the first box, then tap Paste.'); }
      navigator.clipboard.readText().then(function(t){ if (fillCode(t)) err(''); else err('No 6-digit code copied yet. Open the email, copy the code, then come back.'); })
        .catch(function(){ ins[0].focus(); err('Tap and hold the first box, then tap Paste.'); });
    });
    /* coming back from the email app: put the cursor in the boxes so the keyboard can offer the copied code */
    var onBack = function(){ if (document.visibilityState==='visible' && $('codes') && !ins.some(function(x){return x.value;})) ins[0].focus(); };
    document.addEventListener('visibilitychange', onBack);
    $('pw1').addEventListener('input', function(){ var v=this.value, sc=(v.length>=8)+(v.length>=12)+(/[0-9]/.test(v)&&/[a-zA-Z]/.test(v))+(/[^a-zA-Z0-9]/.test(v)); var w=[8,30,55,80,100][sc], tx=['Too short','Okay','Good','Strong','Very strong'][sc], col=sc<1?'var(--dot)':sc<2?'#E8A33B':'var(--lime2)'; var m=$('meter'); m.style.transform='scaleX('+(w/100)+')'; m.style.background=col; $('meterTx').textContent = v.length<8 ? 'At least 8 characters' : tx; });
    $('fSet').addEventListener('submit', function(e){
      e.preventDefault(); var b=$('doSet'); if (b.disabled) return;
      var code=ins.map(function(x){return x.value;}).join(''), p1=$('pw1').value, p2=$('pw2').value, box=$('codes');
      var shakeCodes = function(){ box.classList.remove('shake'); void box.offsetWidth; if(!RM) box.classList.add('shake'); };
      if (!/^\d{6}$/.test(code)) { shakeCodes(); return err('Enter the 6-digit code from the email.'); }
      if (p1.length<8) return err('Use at least 8 characters.');
      if (p1.length>72) return err('Use 72 characters or fewer.');
      if (p1!==p2) return err('The two passwords are different.');
      err(''); busyBtn(b, true, 'Saving…');
      api({ action: AUTH.mode==='reset'?'reset':'signup', email:AUTH.email, code:code, password:p1 }).then(function(r){
        if (r && r.ok && r.token) {
          ins.forEach(function(x,k){ setTimeout(function(){ x.style.background='var(--lime)'; }, RM?0:k*40); });
          var msg = AUTH.mode==='signup' ? 'Account created. Welcome!' : 'Password changed. Other phones were logged out.';
          setTimeout(function(){ gotToken(r.token, msg); }, RM?50:450); return;
        }
        busyBtn(b, false);
        if (r && r.error==='code') { shakeCodes(); return err('That code did not work. Check it or send a new code.'); }
        if (r && r.error==='exists') return err('You already have an account. Log in, or use Forgot password.');
        if (r && r.error==='weak') return err('Use 8 to 72 characters.');
        err(r && r.error==='offline' ? 'Couldn\'t connect. Check your internet.' : 'Something went wrong. Please try again.');
      });
    });
  }
}

/* ---------- toast ---------- */
var tT=null, undoFn=null;
function toast(msg, onUndo){ $('toastTx').textContent=msg; undoFn=onUndo||null; $('undo').hidden=!onUndo; var t=$('toast'); t.classList.add('on'); document.body.classList.add('toast-on'); clearTimeout(tT); tT=setTimeout(function(){ t.classList.remove('on'); document.body.classList.remove('toast-on'); undoFn=null; }, onUndo?5000:2800); }
$('undo').addEventListener('click', function(){ var f=undoFn; undoFn=null; $('toast').classList.remove('on'); document.body.classList.remove('toast-on'); if(f) f(); });

/* ---------- Tara in the panel ---------- */
function fire(ev,extra){ try{ document.dispatchEvent(new CustomEvent('site:analytics',{detail:Object.assign({event:ev},extra||{})})); }catch(_){} }
$('agTab').addEventListener('click', function(){ openTara(''); }); $('agPill').addEventListener('click', function(){ openTara(''); });
$('tClose').innerHTML = ic('x'); $('mic').innerHTML = ic('mic'); document.querySelector('.ib.send').innerHTML = ic('send');
var hist = [], asking = false;
function hello(){ var h=new Date(Date.now()+330*60000).getUTCHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function openTara(q){
  if (!D) return;
  var bd=$('backdrop'), sh=$('agent'); bd.classList.add('on'); sh.classList.add('on','open'); sh.setAttribute('aria-hidden','false'); sh.style.transform='';
  document.body.style.overflow='hidden';
  $('tSub').textContent = pro() ? 'Knows your enquiries and visits. Can mark enquiries contacted for you.' : 'Answers questions about your enquiries and visits';
  if (!$('agMsgs').children.length) addT(hello()+'! '+(REQ.length?REQ.length+(REQ.length===1?' person is':' people are')+' waiting for your reply.':'Everyone has been contacted.')+' What would you like to know?', [], defaultChips());
  setTimeout(function(){ $('tTitle').focus(); }, 60);
  if (q) setTimeout(function(){ ask(q); }, RM?0:380);
}
function closeTara(){ var sh=$('agent'); sh.classList.remove('on','open'); sh.style.transform=''; $('backdrop').classList.remove('on'); sh.setAttribute('aria-hidden','true'); document.body.style.overflow=''; stopMic(); }
$('backdrop').addEventListener('click', closeTara); $('tClose').addEventListener('click', closeTara);
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && $('agent').classList.contains('on')) closeTara(); });
function defaultChips(){ return pro() ? ['Who is waiting longest?','Compare with last week','Busiest day?'] : ['How many visits this month?','Who is waiting?','How do I mark an enquiry contacted?']; }
function addMe(t){ var d=document.createElement('div'); d.className='m me user'; d.textContent=t; $('agMsgs').appendChild(d); scrollMsgs(); }
function findReq(id){ return REQ.find(function(x){return x.id===id;}) || DONE.find(function(x){return x.id===id;}); }
function actBtn(a){
  if (a.type==='open') return '<button type="button" class="btn soft press" data-act="open" data-id="'+esc(a.screen)+'"><span class="fill"></span><span>Open '+(a.screen==='insights'?'Insights':'Enquiries')+'</span></button>';
  if (a.type==='mark_called') { var ids=(a.ticket_ids||[]).filter(function(id){ return REQ.some(function(r){return r.id===id;}); }); if (!ids.length) return ''; return '<button type="button" class="btn lime press" data-act="mark" data-id="'+esc(ids.join(','))+'"><span class="fill"></span><span>'+esc(a.label||'Mark as contacted')+'</span></button>'; }
  var r = findReq(a.ticket_id); if (!r || !r.phone) return '';
  if (a.type==='call') return '<a class="btn dark press" href="'+telHref(r.phone)+'" data-callx="'+r.id+'"><span class="fill"></span><span>Call '+esc(first(r.name))+'</span></a>';
  if (a.type==='whatsapp') return '<a class="btn lime press" href="'+waHref(r.phone, a.text)+'" target="_blank" rel="noopener" data-wax="'+r.id+'"><span class="fill"></span><span>Open in WhatsApp</span></a>';
  return '';
}
function addT(t, acts, chips, extra){
  var d=document.createElement('div'); d.className='m t';
  var btns = (acts||[]).map(actBtn).join('');
  d.innerHTML = '<span>'+esc(t).replace(/\n/g,'<br>')+'</span>' + (extra||'') + (btns?'<div class="acts">'+btns+'</div>':'');
  $('agMsgs').appendChild(d); scrollMsgs();
  $('tchips').innerHTML = (chips||[]).map(function(c){ return '<button type="button" class="chip press" data-q="'+esc(c)+'">'+esc(c)+'</button>'; }).join('');
}
function scrollMsgs(){ var m=$('agMsgs'); m.scrollTo({ top:m.scrollHeight, behavior: RM?'auto':'smooth' }); }
function typing(on){ $('agTyping').hidden=!on; var ty=$('typing'); if (on && !ty) { var d=document.createElement('div'); d.className='m t typing'; d.id='typing'; d.setAttribute('aria-label','Tara is typing'); d.innerHTML='<i></i><i></i><i></i>'; $('agMsgs').appendChild(d); scrollMsgs(); } else if (!on && ty) ty.remove(); }
function ask(q){
  q = String(q||'').trim().slice(0,500); if(!q || asking) return;
  asking = true; addMe(q); $('tchips').innerHTML=''; typing(true);
  var body = { token:TOKEN, site_id:state.site, question:q, history:hist.slice(-8) };
  hist.push({ role:'owner', text:q });
  post(TARA, body, 45000).then(function(r){
    typing(false); asking=false;
    if (r && r.ok && r.reply) { hist.push({ role:'tara', text:r.reply }); var mk=(r.marked||[]).filter(function(m){ return m && /^[0-9a-f-]{36}$/.test(m.id); }); if (mk.length) taraMarked(mk); addT(r.reply, r.actions||[], (r.chips&&r.chips.length)?r.chips:defaultChips(), mk.length?'<div class="acts"><button type="button" class="btn soft press" data-act="undo" data-id="'+esc(mk.map(function(m){return m.id;}).join(','))+'"><span class="fill"></span><span>Undo</span></button></div>':''); return; }
    if (r && r.error==='login') { addT('Your login has ended. Please log in again.', [], []); setTimeout(function(){ signOut('Please log in again.'); }, 1400); return; }
    hist.pop();
    fire('agent_error');
    addT(r && r.error==='offline' ? 'Couldn\'t connect. Check your internet and try again.' : 'Sorry, I couldn\'t answer that just now. Please try again.', [], [q].concat(defaultChips()).slice(0,3));
  });
}
$('tForm').addEventListener('submit', function(e){ e.preventDefault(); var v=$('tIn').value; $('tIn').value=''; ask(v); });
$('tchips').addEventListener('click', function(e){ var b=e.target.closest('[data-q]'); if(b) ask(b.getAttribute('data-q')); });
$('agMsgs').addEventListener('click', function(e){
  var b=e.target.closest('[data-act]'); if(!b||b.disabled) return; var act=b.getAttribute('data-act'), id=b.getAttribute('data-id');
  if (act==='undo') { undoTara(b, id.split(',')); return; }
  if (act==='open') { closeTara(); setTimeout(function(){ go(id==='insights'?'insights':'requests'); }, 200); }
  if (act==='mark') { b.disabled=true; b.classList.add('go'); setTimeout(function(){ id.split(',').forEach(function(x){ markDone(x, null, true); }); b.querySelector('span:last-child').textContent='Done ✓'; if (state.screen==='home'||state.screen==='requests') go(state.screen, true); }, RM?50:720); }
});
/* Pro Tara marked requests herself: show it at once everywhere; Undo puts them back. */
function setStatus(ids, st){ (D&&D.tickets||[]).forEach(function(t){ if (ids.indexOf(t.id)>=0) { t.status=st; t.called_back_at = st==='new' ? null : new Date().toISOString(); } }); shapeTickets(); renderNav(); if (state.screen==='home'||state.screen==='requests') go(state.screen, true); }
function taraMarked(mk){ setStatus(mk.map(function(m){ return m.id; }), 'called_back'); }
function undoTara(b, ids){
  b.disabled=true; b.querySelector('span:last-child').textContent='Undoing…';
  Promise.all(ids.map(function(id){ return api({ action:'unmark_called', token:TOKEN, ticket_id:id }, 15000); })).then(function(rs){
    var back = ids.filter(function(id,i){ return rs[i] && rs[i].ok; });
    if (back.length) setStatus(back, 'new');
    b.querySelector('span:last-child').textContent = back.length===ids.length ? 'Undone ✓' : (back.length ? 'Partly undone' : 'Couldn\'t undo');
    if (!back.length) { b.disabled=false; toast(rs.some(function(r){ return r && r.error==='offline'; }) ? 'Couldn\'t connect. Check your internet.' : 'Undo works for 30 minutes after marking.'); }
  });
}
/* voice: the phone's own speech-to-text, when the browser has it */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null;
if (!SR) { $('mic').hidden = true; }
function stopMic(){ $('mic').classList.remove('on'); if (rec) { try { rec.abort(); } catch(e){} rec=null; } }
$('mic').addEventListener('click', function(){
  var m=this; if (rec) { stopMic(); return; }
  try {
    rec = new SR(); rec.lang = /[ऀ-ॿ]/.test(($('agMsgs').textContent||'').slice(-200)) ? 'hi-IN' : 'en-IN'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onresult = function(ev){ var t = ev.results && ev.results[0] && ev.results[0][0] ? ev.results[0][0].transcript : ''; stopMic(); if (t) ask(t); };
    rec.onerror = function(){ stopMic(); toast('Couldn\'t hear that. Try again or type.'); };
    rec.onend = function(){ m.classList.remove('on'); rec=null; };
    m.classList.add('on'); rec.start();
  } catch(e) { stopMic(); }
});
/* drag the sheet down to close */
(function(){ var sh=$('agent'), g=$('grab'), y0=0, dy=0, t0=0, pid=null;
  g.addEventListener('pointerdown', function(e){ if(pid!==null) return; pid=e.pointerId; y0=e.clientY; dy=0; t0=Date.now(); sh.classList.add('drag'); try{g.setPointerCapture(pid);}catch(_){} });
  g.addEventListener('pointermove', function(e){ if(e.pointerId!==pid) return; var d=e.clientY-y0; dy = d<0 ? d*0.2 : d; sh.style.transform='translate(-50%,'+dy+'px)'; });
  function up(e){ if(e.pointerId!==pid) return; pid=null; sh.classList.remove('drag'); var v=dy/Math.max(1,Date.now()-t0); if (dy>sh.offsetHeight*0.3 || v>0.11&&dy>30) closeTara(); else sh.style.transform=''; }
  g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
})();

/* ---------- start ---------- */
renderNav();
if (TOKEN) loadData({ home:true }); else showLogin();
})();

</script>
<script src="https://amuwa-hub.github.io/tara/tara.js"></script>
<script>
/* Tara in the panel never covers anything the owner needs: she fades while scrolling, steps aside for toasts,
   and when she stops she stands at the right, or the left, only where nothing tappable is under her. Otherwise she waits out of sight. */
(function(){
var mx=document.getElementById('mx'); if(!mx) return; var t=null;
var SEL='a,button,input,textarea,select,.tile,.req,.card,.hero,.menu,.kpi,.empty,.lockwrap,.hint,h1,h2,p';
function box(left){
  var w=mx.offsetWidth||88, h=mx.offsetHeight||88, cs=getComputedStyle(mx);
  var bottom=parseFloat(cs.bottom)||88, top=innerHeight-bottom-h;
  var x=left?10:innerWidth-10-w;
  return {l:x+w*0.16, r:x+w*0.84, t:top+h*0.08, b:top+h};
}
function hits(b){
  var els=document.querySelectorAll('#screens '+SEL.split(',').join(',#screens '));
  for (var i=0;i<els.length;i++){ var r=els[i].getBoundingClientRect(); if(!r.width||!r.height) continue;
    if (r.left<b.r && r.right>b.l && r.top<b.b && r.bottom>b.t) return true; }
  return false;
}
/* After the owner stops touching, Tara comes back as her full self, in the same spot she stood before. */
var firstPick=true;
function place(){
  if (mx.classList.contains('placed')||mx.classList.contains('away')||mx.classList.contains('scrolling')) return;
  if (firstPick) { firstPick=false; if (hits(box(false)) && !hits(box(true))) mx.classList.add('mx-left'); }
  mx.classList.remove('blocked');
  peek();
}
var pk=document.getElementById('mxPeek');
function peek(){ pk.hidden = !(mx.classList.contains('blocked') && !mx.classList.contains('away') && !mx.classList.contains('placed')); }
pk.addEventListener('click',function(){ var b=document.getElementById('agTab'); if(b) b.click(); });
window.__placeTara=place;
/* while the owner touches, swipes or scrolls, Tara steps out of sight; she comes back when the screen is idle */
var down=false;
function back(ms){ clearTimeout(t); t=setTimeout(function(){ if(down) return; mx.classList.remove('scrolling'); place(); },ms); }
addEventListener('scroll',function(){ mx.classList.add('scrolling'); back(1500); },{passive:true});
addEventListener('pointerdown',function(e){ if(e.target.closest && e.target.closest('#mx,#mxPeek,#agent')) return; down=true; mx.classList.add('scrolling'); clearTimeout(t); },{passive:true,capture:true});
function up(){ if(!down) return; down=false; back(1800); }
addEventListener('pointerup',up,{passive:true,capture:true}); addEventListener('pointercancel',up,{passive:true,capture:true});
var t3=null; addEventListener('resize',function(){ clearTimeout(t3); t3=setTimeout(place,200); });
var t2=null; new MutationObserver(function(){ clearTimeout(t2); t2=setTimeout(place,450); }).observe(document.getElementById('screens'),{childList:true,subtree:true});
new MutationObserver(function(){ peek(); if(!mx.classList.contains('away')) setTimeout(place,30); }).observe(mx,{attributes:true,attributeFilter:['class']});
setTimeout(function(){ place(); if(window.TaraMascot && !mx.classList.contains('away') && !mx.classList.contains('blocked')) window.TaraMascot.play('wave'); },2100);
/* opening animation: logo, name and line, then the panel or login */
var sp=document.getElementById('splash');
if (sp) setTimeout(function(){ sp.classList.add('out'); setTimeout(function(){ sp.remove(); }, 600); }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 500 : 1700);
})();
</script>
